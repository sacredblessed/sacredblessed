<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#070d1f"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a11cb"/>
      <stop offset="1" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2575fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#2575fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="170" rx="20"/></clipPath>
    <!-- one wave period is 600px wide; drawn twice so it can loop seamlessly -->
    <path id="wave" d="M0 40 C150 0 450 80 600 40 C750 0 1050 80 1200 40 C1350 0 1650 80 1800 40 V200 H0 Z"/>
  </defs>

  <style>
    .wa { animation: slide 12s linear infinite; }
    .wb { animation: slide 18s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .star { animation: tw 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
    @keyframes tw { 50% { opacity: .15; } }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="170" fill="url(#bg)"/>

    <g fill="#c4b5fd">
      <circle class="star" cx="120" cy="30" r="1.6"/>
      <circle class="star s2" cx="310" cy="58" r="1.2"/>
      <circle class="star s3" cx="880" cy="26" r="1.6"/>
      <circle class="star" cx="1060" cy="62" r="1.2"/>
      <circle class="star s2" cx="980" cy="40" r="1"/>
      <circle class="star s3" cx="210" cy="72" r="1"/>
    </g>

    <text x="600" y="50" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1">Thanks for stopping by <tspan fill="#7b61ff">·</tspan> Uğradığın için teşekkürler</text>
    <rect x="450" y="64" width="300" height="2" fill="url(#line)"/>
    <text x="600" y="90" text-anchor="middle" class="mono" font-size="14" fill="#8b93a7">discord <tspan fill="#c4b5fd">@devblessed</tspan>  ·  <tspan fill="#93c5fd">BB Store</tspan></text>

    <g transform="translate(0 112)">
      <use href="#wave" class="wb" fill="url(#w2)" opacity="0.35" transform="translate(0 -14)"/>
      <use href="#wave" class="wa" fill="url(#w1)" opacity="0.85"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="169" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
